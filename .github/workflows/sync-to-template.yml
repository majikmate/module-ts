name: Sync to Template Repository

on:
  push:
    branches:
      - main

jobs:
  sync-to-template:
    # Only run if this is NOT the template repo itself
    if: github.repository != 'majikmate/module-ts'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Copy Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Add Template Repository as Remote
        run: |
          git remote add template https://x-access-token:${{ secrets.TEMPLATE_SYNC_TOKEN }}@github.com/majikmate/module-ts.git
          git fetch template
      
      - name: Create Branch for PR
        run: |
          BRANCH_NAME="sync-from-${{ github.repository_owner }}-$(date +%Y%m%d-%H%M%S)"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          git checkout -b $BRANCH_NAME
      
      - name: Push to Template Repository
        run: |
          git push template ${{ env.BRANCH_NAME }}
      
      - name: Create Pull Request
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          script: |
            const { data: pr } = await github.rest.pulls.create({
              owner: 'majikmate',
              repo: 'module-ts',
              title: `Sync changes from ${context.repo.owner}/${context.repo.repo}`,
              head: process.env.BRANCH_NAME,
              base: 'main',
              body: `## Automatic Sync from Copy Repository
              
              This PR contains changes from the copy repository: **${context.repo.owner}/${context.repo.repo}**
              
              ### Details
              - Source Repository: \`${context.repo.owner}/${context.repo.repo}\`
              - Source Branch: \`${context.ref.replace('refs/heads/', '')}\`
              - Commit: ${context.sha}
              - Triggered by: @${context.actor}
              
              Please review these changes before merging into the template repository.`
            });
            
            console.log(`Created PR #${pr.number}: ${pr.html_url}`);
