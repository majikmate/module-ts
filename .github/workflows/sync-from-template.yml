name: Sync changes from template

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: sync-from-template-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sync-from-template:
    runs-on: ubuntu-latest

    steps:
      - name: Validate sync prerequisites
        id: validate
        uses: actions/github-script@v7
        with:
          script: |
            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            // Check if this repo is a fork
            if (repo.fork) {
              core.info('⏭️ This repository is a fork. Skipping sync to prevent duplicate syncs.');
              core.setOutput('should-sync', 'false');
              return;
            }
            
            // Check if this repo was created from a template
            if (!repo.template_repository) {
              core.info('⏭️ This repository was not created from a template. Skipping sync.');
              core.setOutput('should-sync', 'false');
              return;
            }
            
            // Check if token is configured
            const hasToken = '${{ secrets.TEMPLATE_SYNC_TOKEN }}' !== '';
            if (!hasToken) {
              core.info('⏭️ TEMPLATE_SYNC_TOKEN is not configured. Skipping sync.');
              core.setOutput('should-sync', 'false');
              return;
            }
            
            // Extract template owner and repo
            const templateFullName = repo.template_repository.full_name;
            const parts = templateFullName.split('/');
            
            // Validate template repository format
            if (parts.length !== 2 || !parts[0] || !parts[1]) {
              core.setFailed(`Invalid template repository format: ${templateFullName}`);
              core.setOutput('should-sync', 'false');
              return;
            }
            
            const [templateOwner, templateRepo] = parts;
            
            // Validate GitHub naming rules (alphanumeric, hyphens, underscores, dots)
            if (!/^[a-zA-Z0-9._-]+$/.test(templateOwner) || !/^[a-zA-Z0-9._-]+$/.test(templateRepo)) {
              core.setFailed('Invalid characters in template repository name');
              core.setOutput('should-sync', 'false');
              return;
            }
            
            core.info(`✅ This repository was created from template: ${templateFullName}`);
            core.setOutput('should-sync', 'true');
            core.setOutput('template-owner', templateOwner);
            core.setOutput('template-repo', templateRepo);

      - name: Query template default branch
        if: steps.validate.outputs.should-sync == 'true'
        id: template-branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          script: |
            try {
              const { data: templateRepo } = await github.rest.repos.get({
                owner: '${{ steps.validate.outputs.template-owner }}',
                repo: '${{ steps.validate.outputs.template-repo }}'
              });
              const defaultBranch = templateRepo.default_branch;
              core.info(`✅ Template default branch: ${defaultBranch}`);
              core.setOutput('default-branch', defaultBranch);
            } catch (error) {
              core.warning(`Could not query default branch, using 'main': ${error.message}`);
              core.setOutput('default-branch', 'main');
            }

      - name: Validate token permissions
        if: steps.validate.outputs.should-sync == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          script: |
            try {
              // Verify token can access template repo
              const { data: repo } = await github.rest.repos.get({
                owner: '${{ steps.validate.outputs.template-owner }}',
                repo: '${{ steps.validate.outputs.template-repo }}'
              });
              
              core.info(`✅ Token has access to template repository: ${repo.full_name}`);
              
              // Check token identity and permissions
              const { data: user } = await github.rest.users.getAuthenticated();
              core.info(`✅ Token belongs to: ${user.login} (type: ${user.type})`);
              
              if (user.site_admin) {
                core.warning('⚠️ Token has site admin privileges - consider using a less privileged token');
              }
            } catch (error) {
              if (error.status === 404) {
                core.setFailed(`Token cannot access template repository. Check token permissions and repository existence.`);
              } else if (error.status === 401) {
                core.setFailed(`Token authentication failed. Check if token is valid.`);
              } else {
                core.setFailed(`Token validation failed: ${error.message}`);
              }
            }

      - name: Checkout this repo
        if: steps.validate.outputs.should-sync == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed to compare with template
          persist-credentials: false

      - name: Configure Git identity
        if: steps.validate.outputs.should-sync == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch template repository
        if: steps.validate.outputs.should-sync == 'true'
        env:
          GIT_ASKPASS: echo
          GIT_USERNAME: x-access-token
          GIT_PASSWORD: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          TEMPLATE_OWNER: ${{ steps.validate.outputs.template-owner }}
          TEMPLATE_REPO: ${{ steps.validate.outputs.template-repo }}
        run: |
          # Configure git to use credentials from environment without prompting
          git config --local credential.helper '!f() { echo "username=${GIT_USERNAME}"; echo "password=${GIT_PASSWORD}"; }; f'
          TEMPLATE_BRANCH="${{ steps.template-branch.outputs.default-branch }}"
          git fetch "https://github.com/${TEMPLATE_OWNER}/${TEMPLATE_REPO}.git" "${TEMPLATE_BRANCH}:refs/remotes/template/${TEMPLATE_BRANCH}"
          # Clear credential helper immediately
          git config --local --unset credential.helper

      - name: Check if template has new changes
        if: steps.validate.outputs.should-sync == 'true'
        id: check-changes
        run: |
          # Get the merge-base (common ancestor)
          TEMPLATE_BRANCH="${{ steps.template-branch.outputs.default-branch }}"
          MERGE_BASE=$(git merge-base HEAD "refs/remotes/template/${TEMPLATE_BRANCH}")
          
          # Check if template has commits we don't have
          BEHIND=$(git rev-list --count "${MERGE_BASE}..refs/remotes/template/${TEMPLATE_BRANCH}")
          
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "merge-base=$MERGE_BASE" >> "$GITHUB_OUTPUT"
          
          if [ "$BEHIND" -eq "0" ]; then
            echo "✅ Already up-to-date with template"
          else
            echo "✅ Template has $BEHIND new commit(s)"
          fi

      - name: Create sync branch
        if: steps.check-changes.outputs.behind != '0'
        id: create-branch
        run: |
          # Use random identifier for uniqueness (same pattern as sync-to-template)
          RANDOM_ID=$(openssl rand -hex 8)
          BRANCH_NAME="sync-from-template-${RANDOM_ID}"
          
          echo "branch-name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          
          # Create new branch from current HEAD
          git checkout -b "$BRANCH_NAME"
          
          echo "✅ Created branch: $BRANCH_NAME"

      - name: Merge template changes
        if: steps.check-changes.outputs.behind != '0'
        id: merge
        run: |
          set +e  # Don't exit on error, we'll handle it
          
          # Attempt to merge template changes
          TEMPLATE_BRANCH="${{ steps.template-branch.outputs.default-branch }}"
          git merge "refs/remotes/template/${TEMPLATE_BRANCH}" --no-edit -m "Merge updates from template repository"
          MERGE_EXIT=$?
          
          if [ $MERGE_EXIT -eq 0 ]; then
            echo "merge-status=success" >> $GITHUB_OUTPUT
            echo "✅ Template changes merged successfully"
          else
            # Check if there are conflicts
            if git ls-files -u | grep -q .; then
              echo "merge-status=conflicts" >> $GITHUB_OUTPUT
              echo "⚠️ Merge conflicts detected"
              
              # Abort the merge to clean state
              git merge --abort
              
              # Create a merge commit with conflicts marked
              git merge "refs/remotes/template/${TEMPLATE_BRANCH}" --no-commit --no-ff || true
              
              # List conflicts
              echo "## Conflicting files:" >> $GITHUB_STEP_SUMMARY
              git diff --name-only --diff-filter=U >> $GITHUB_STEP_SUMMARY
            else
              echo "merge-status=error" >> $GITHUB_OUTPUT
              echo "❌ Merge failed with unexpected error"
              exit 1
            fi
          fi

      - name: Push sync branch
        if: steps.check-changes.outputs.behind != '0'
        env:
          GIT_ASKPASS: echo
          GIT_USERNAME: x-access-token
          GIT_PASSWORD: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
        run: |
          # Configure git to use credentials from environment without prompting
          git config --local credential.helper '!f() { echo "username=${GIT_USERNAME}"; echo "password=${GIT_PASSWORD}"; }; f'
          git push origin ${{ steps.create-branch.outputs.branch-name }}
          # Clear credential helper immediately
          git config --local --unset credential.helper

      - name: Query current repo default branch
        if: steps.check-changes.outputs.behind != '0'
        id: current-branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          script: |
            try {
              const { data: currentRepo } = await github.rest.repos.get({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              const defaultBranch = currentRepo.default_branch;
              core.info(`✅ Current repo default branch: ${defaultBranch}`);
              core.setOutput('default-branch', defaultBranch);
            } catch (error) {
              core.warning(`Could not query default branch, using 'main': ${error.message}`);
              core.setOutput('default-branch', 'main');
            }

      - name: Create Pull Request
        if: steps.check-changes.outputs.behind != '0'
        id: create-pr
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          script: |
            // Sanitize user-controlled inputs to prevent injection
            const sanitize = (str) => {
              if (!str) return '';
              return String(str)
                .slice(0, 200)
                .replace(/[`${}\\]/g, '\\$&')
                .replace(/\n/g, ' ')
                .trim();
            };
            
            const mergeStatus = '${{ steps.merge.outputs.merge-status }}';
            const templateOwner = sanitize('${{ steps.validate.outputs.template-owner }}');
            const templateRepo = sanitize('${{ steps.validate.outputs.template-repo }}');
            const behindCount = sanitize('${{ steps.check-changes.outputs.behind }}');
            const templateBranch = sanitize('${{ steps.template-branch.outputs.default-branch }}');
            
            let title, body;
            
            if (mergeStatus === 'conflicts') {
              title = `⚠️ Sync from template (${behindCount} commits) - HAS CONFLICTS`;
              body = [
                `## ⚠️ Template Sync with Conflicts`,
                ``,
                `This PR syncs ${behindCount} new commit(s) from the template repository, but **has merge conflicts** that require manual resolution.`,
                ``,
                `### Source`,
                `- Template: \`${templateOwner}/${templateRepo}\``,
                `- Branch: \`${templateBranch}\``,
                ``,
                `### Action Required`,
                `1. Check out this branch locally`,
                `2. Resolve merge conflicts`,
                `3. Commit the resolved changes`,
                `4. Push to update this PR`,
                ``,
                `### Commands`,
                `\`\`\`bash`,
                `git fetch origin`,
                `git checkout ${{ steps.create-branch.outputs.branch-name }}`,
                `git merge template/${templateBranch}`,
                `# Resolve conflicts in your editor`,
                `git add .`,
                `git commit`,
                `git push`,
                `\`\`\``,
                ``,
                `---`,
                `🤖 *Automatically created by template sync workflow*`
              ].join('\n');
            } else {
              title = `Sync from template (${behindCount} commits)`;
              body = [
                `## 📥 Template Sync`,
                ``,
                `This PR syncs ${behindCount} new commit(s) from the template repository.`,
                ``,
                `### Source`,
                `- Template: \`${templateOwner}/${templateRepo}\``,
                `- Branch: \`${templateBranch}\``,
                ``,
                `### Status`,
                `✅ No merge conflicts detected - ready to merge`,
                ``,
                `---`,
                `🤖 *Automatically created by template sync workflow*`
              ].join('\n');
            }
            
            try {
              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                head: '${{ steps.create-branch.outputs.branch-name }}',
                base: '${{ steps.current-branch.outputs.default-branch }}',
                body: body
              });
              
              core.info(`✅ Created PR #${pr.number}: ${pr.html_url}`);
              core.setOutput('pr-number', pr.number);
              core.setOutput('pr-url', pr.html_url);
              
              // Add labels if possible
              if (mergeStatus === 'conflicts') {
                try {
                  await github.rest.issues.addLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    labels: ['merge-conflict', 'template-sync']
                  });
                } catch (error) {
                  core.info('Could not add labels (labels may not exist)');
                }
              }
              
            } catch (error) {
              if (error.status === 422 && error.message.includes('pull request already exists')) {
                core.info('⏭️ A pull request already exists for this branch');
              } else {
                core.setFailed(`Failed to create PR: ${error.message}`);
                throw error;
              }
            }

      - name: Auto-merge PR if no conflicts
        if: steps.create-pr.outputs.pr-number && steps.merge.outputs.merge-status == 'success'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = ${{ steps.create-pr.outputs.pr-number }};

            // Poll for mergeable state with retries (GitHub needs time to compute)
            let attempts = 0;
            let prData;
            
            core.info('⏳ Waiting for GitHub to compute mergeable state...');
            
            while (attempts < 10) {
              prData = (await github.rest.pulls.get({ owner, repo, pull_number })).data;
              
              core.info(`Attempt ${attempts + 1}/10: mergeable=${prData.mergeable}, state=${prData.mergeable_state}`);
              
              // If state is determined (not null or unknown), exit loop
              if (prData.mergeable !== null && prData.mergeable_state !== 'unknown') {
                break;
              }
              
              await new Promise(resolve => setTimeout(resolve, 3000));
              attempts++;
            }
            
            // Handle different mergeable states
            if (prData.mergeable_state === 'clean') {
              core.info('✅ PR is clean and ready to merge. Auto-merging...');
              
              try {
                await github.rest.pulls.merge({
                  owner, repo, pull_number,
                  merge_method: 'merge',
                  commit_title: `Auto-merge: ${prData.title}`,
                  commit_message: 'Automatically merged - no conflicts detected.'
                });
                
                core.info(`✅ Successfully merged PR #${pull_number}`);
                
                // Add success comment
                await github.rest.issues.createComment({
                  owner, repo, issue_number: pull_number,
                  body: '🤖 **Auto-merged successfully!**\n\nNo conflicts detected. Changes have been merged from the template repository.'
                });
                
                // Delete the sync branch after successful merge
                try {
                  await github.rest.git.deleteRef({
                    owner, repo,
                    ref: `heads/${{ steps.create-branch.outputs.branch-name }}`
                  });
                  core.info(`🧹 Deleted branch: ${{ steps.create-branch.outputs.branch-name }}`);
                } catch (error) {
                  core.warning(`Could not delete branch: ${error.message}`);
                }
              } catch (error) {
                core.setFailed(`Failed to merge PR: ${error.message}`);
              }
            } else if (prData.mergeable_state === 'dirty') {
              core.warning('⚠️ PR has merge conflicts. Manual resolution required.');
              await github.rest.issues.createComment({
                owner, repo, issue_number: pull_number,
                body: '⚠️ **Manual review required**\n\nThis PR has merge conflicts and cannot be auto-merged. Please review and resolve conflicts manually.'
              });
            } else if (prData.mergeable_state === 'blocked') {
              core.warning('⚠️ PR is blocked by branch protection rules (required checks, reviewers, etc.).');
              await github.rest.issues.createComment({
                owner, repo, issue_number: pull_number,
                body: '⚠️ **Blocked by branch protection**\n\nThis PR cannot be auto-merged due to branch protection rules. Required status checks or reviews may be needed.'
              });
            } else if (prData.mergeable_state === 'behind') {
              core.warning('⚠️ PR is behind the base branch. Update required.');
            } else if (prData.mergeable_state === 'unstable') {
              core.warning('⚠️ PR has failing status checks. Review required.');
              await github.rest.issues.createComment({
                owner, repo, issue_number: pull_number,
                body: '⚠️ **Status checks failing**\n\nThis PR has failing status checks and cannot be auto-merged. Please review the failed checks.'
              });
            } else {
              core.warning(`⚠️ Unexpected mergeable state: ${prData.mergeable_state}. Manual review recommended.`);
            }

      - name: Summary
        if: always() && steps.check-changes.conclusion != 'skipped'
        run: |
          echo "## 🔄 Template Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.check-changes.outputs.behind }}" = "0" ]; then
            echo "✅ Repository is up-to-date with template" >> $GITHUB_STEP_SUMMARY
          else
            echo "📥 Synced ${{ steps.check-changes.outputs.behind }} commit(s) from template" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ -n "${{ steps.create-pr.outputs.pr-url }}" ]; then
              echo "**Pull Request:** ${{ steps.create-pr.outputs.pr-url }}" >> $GITHUB_STEP_SUMMARY
              
              if [ "${{ steps.merge.outputs.merge-status }}" = "conflicts" ]; then
                echo "" >> $GITHUB_STEP_SUMMARY
                echo "⚠️ **Manual conflict resolution required**" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          fi

      - name: Cleanup on failure
        if: failure() && steps.create-branch.outputs.branch-name
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branchName = '${{ steps.create-branch.outputs.branch-name }}';
            
            if (branchName) {
              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branchName}`
                });
                core.info(`🧹 Cleaned up failed branch: ${branchName}`);
              } catch (error) {
                core.info('No cleanup needed or branch already deleted');
              }
            }
